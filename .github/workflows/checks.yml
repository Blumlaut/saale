name: checks

# Pull-request checks that scale with the diff, not with the repo.
#
# Lint, formatting and tests are file-scoped: only what the PR touches is
# passed to eslint, prettier and vitest. Typechecking is the one step that
# cannot be honest per-file (a changed signature breaks callers elsewhere), so
# it runs project-wide with a build-info cache, which makes a re-run cheap.
#
# Installing is the expensive part of a cold run, so it is cached twice:
# `node_modules` itself (keyed on the lockfile) and npm's download cache. A run
# whose lockfile is unchanged skips `npm ci` entirely and only regenerates the
# Prisma client, and a diff with nothing to check skips Node altogether.
#
# `npm run check` stays the thing to run before a big change; this is the floor
# that keeps a one-file fix from merging untested.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # `prisma generate` runs on install and reads the datasource through
  # prisma.config.mjs. Nothing connects, so any parseable URL will do.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  NEXT_TELEMETRY_DISABLED: "1"
  # Nothing here reads an audit report or cares who needs funding, and a
  # restored download cache is good enough without revalidating it.
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"

jobs:
  changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch is the diff this job is about.
          fetch-depth: 0

      # Needs nothing but git, and runs before Node so a diff with no code,
      # markdown or tests never pays for a toolchain.
      - name: Collect the files this PR touches
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            git fetch --no-tags origin "$base"
            range="origin/$base...HEAD"
          else
            range="HEAD~1...HEAD"
          fi

          any=false
          list() {
            local kind="$1" pattern="$2"
            local path="$RUNNER_TEMP/$kind.txt"
            # -z: NUL separated, so a path with spaces or brackets survives.
            git diff --name-only -z --diff-filter=ACMR "$range" \
              | grep -zE "$pattern" > "$path" || true
            if [ -s "$path" ]; then
              echo "$kind=true" >> "$GITHUB_OUTPUT"
              any=true
              echo "($kind)" && tr '\0' '\n' < "$path"
            else
              echo "$kind=false" >> "$GITHUB_OUTPUT"
            fi
          }

          list lint   '\.(ts|tsx|js|mjs|cjs|mts)$'
          # Same scope as `npm run format:check`. Loose markdown in plans/ and
          # docs/ is deliberately not held to prettier, and src TS is already
          # formatted by eslint's prettier plugin above.
          list format '^src/.*\.md$|^e2e/.*\.(ts|tsx)$'
          list code   '\.(ts|tsx|mts|cts)$'
          # vitest only includes __tests__; e2e specs are Playwright, not vitest.
          list tests  '^__tests__/.*\.(test|spec)\.(ts|tsx)$'

          echo "any=$any" >> "$GITHUB_OUTPUT"

      # Node is not pinned: the runner takes the newest release. Its major goes
      # into the node_modules cache key, so a new major installs from scratch
      # instead of restoring a tree built for the one before it.
      - name: Resolve the latest Node version
        id: node
        if: steps.files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://nodejs.org/dist/index.json | jq -r '.[0].version')"
          major="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${major%%.*}" >> "$GITHUB_OUTPUT"

      # The install itself. Restoring the tree beats re-extracting it and
      # re-running every postinstall (native builds, Prisma engines), and one
      # cache entry per lockfile is small enough to keep. No `restore-keys`: a
      # tree that does not match the lockfile is worth less than a fresh
      # install, and `npm ci` wipes the directory anyway. Restored before Node
      # is set up because it needs no toolchain.
      - name: Restore node_modules
        id: modules
        if: steps.files.outputs.any == 'true'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.major }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/setup-node@v7
        if: steps.files.outputs.any == 'true'
        with:
          node-version: ${{ steps.node.outputs.version }}
          # npm's download cache, so a miss installs offline. Pointless once the
          # tree is restored, and restoring it costs more than it saves.
          cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'npm' || '' }}

      - name: Install
        if: steps.files.outputs.any == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # A restored tree carries the client that was generated when it was
      # cached, which may be older than the schema in this checkout. Cheap, so
      # it runs either way rather than relying on `prepare` having fired.
      - name: Generate the Prisma client
        if: steps.files.outputs.any == 'true'
        run: npx prisma generate

      - name: Lint the touched files
        if: steps.files.outputs.lint == 'true'
        run: xargs -0 -a "$RUNNER_TEMP/lint.txt" npx eslint --max-warnings=0

      - name: Check formatting of the touched files
        if: steps.files.outputs.format == 'true'
        run: xargs -0 -a "$RUNNER_TEMP/format.txt" npx prettier --check

      # Whole-project by necessity. The cache key changes with every push, so
      # the restore-keys prefix always hands over the previous run's build info
      # and tsc only re-checks what the diff can affect.
      - name: Restore the typecheck cache
        if: steps.files.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: "**/*.tsbuildinfo"
          key: tsc-${{ runner.os }}-${{ github.base_ref || 'main' }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ github.base_ref || 'main' }}-
            tsc-${{ runner.os }}-

      - name: Typecheck
        if: steps.files.outputs.code == 'true'
        run: npm run typecheck

      - name: Test the touched suites
        if: steps.files.outputs.tests == 'true'
        run: xargs -0 -a "$RUNNER_TEMP/tests.txt" npx vitest run --reporter=dot

      - name: Nothing to check
        if: steps.files.outputs.any == 'false'
        run: echo "No code, markdown or test files in this diff."
