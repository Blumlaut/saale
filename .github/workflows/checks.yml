name: checks

# Pull-request checks that scale with the diff, not with the repo.
#
# Lint, formatting and tests are file-scoped: only what the PR touches is
# passed to eslint, prettier and vitest. Typechecking is the one step that
# cannot be honest per-file (a changed signature breaks callers elsewhere), so
# it runs project-wide with a build-info cache, which makes a re-run cheap. The
# production dependency check is the other: a runtime import that lives in
# `devDependencies` only fails once the image runs, so it links the tree the way
# the image does and looks for every import there. The client boundary check is
# project-wide for the same reason: an import chain only breaks the browser
# bundle once it is followed to the end.
#
# Installing is the expensive part of a cold run, so it is cached twice:
# `node_modules` itself (keyed on the lockfile) and pnpm's store along with the
# cache that holds registry metadata and the lockfile verification log. A run
# whose lockfile is unchanged skips the install entirely and only regenerates the
# Prisma client, and a diff with nothing to check runs no pnpm at all.
#
# `pnpm run check` stays the thing to run before a big change; this is the floor
# that keeps a one-file fix from merging untested.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # `prisma generate` runs on install and reads the datasource through
  # prisma.config.mjs. Nothing connects, so any parseable URL will do.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  NEXT_TELEMETRY_DISABLED: "1"
  # pnpm 12 reads its own prefix only, so npm_config_* would be ignored here.
  # Nothing reads an audit report or cares who needs funding, and a restored
  # store is good enough without revalidating it.
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"
  PNPM_CONFIG_PREFER_OFFLINE: "true"

jobs:
  changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch is the diff this job is about.
          fetch-depth: 0

      # Needs nothing but git, and runs before Node so a diff with no code,
      # markdown or tests never pays for a toolchain.
      - name: Collect the files this PR touches
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            git fetch --no-tags origin "$base"
            range="origin/$base...HEAD"
          else
            range="HEAD~1...HEAD"
          fi

          any=false
          list() {
            local kind="$1" pattern="$2"
            local path="$RUNNER_TEMP/$kind.txt"
            # -z: NUL separated, so a path with spaces or brackets survives.
            git diff --name-only -z --diff-filter=ACMR "$range" \
              | grep -zE "$pattern" > "$path" || true
            if [ -s "$path" ]; then
              echo "$kind=true" >> "$GITHUB_OUTPUT"
              any=true
              echo "($kind)" && tr '\0' '\n' < "$path"
            else
              echo "$kind=false" >> "$GITHUB_OUTPUT"
            fi
          }

          list lint   '\.(ts|tsx|js|mjs|cjs|mts)$'
          # Same scope as `pnpm run format:check`. Loose markdown in docs/ is
          # deliberately not held to prettier, and src TS is already formatted by
          # eslint's prettier plugin above.
          list format '^src/.*\.md$|^e2e/.*\.(ts|tsx)$'
          list code   '\.(ts|tsx|mts|cts)$'
          # Changes to these can change which packages the production tree holds.
          list deps   '^package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^patches/'
          # vitest only includes __tests__; e2e specs are Playwright, not vitest.
          list tests  '^__tests__/.*\.(test|spec)\.(ts|tsx)$'

          echo "any=$any" >> "$GITHUB_OUTPUT"

      # The install itself. Restoring the tree beats re-linking it and running
      # every build script (native builds, Prisma engines), and one cache entry
      # per lockfile is small enough to keep. No `restore-keys`: a tree that does
      # not match the lockfile is worth less than a fresh install, and a
      # `--frozen-lockfile` install rewrites the directory anyway. The runtime
      # pnpm installs for `devEngines.runtime` lives in there too, which is why
      # the key needs no Node version of its own.
      - name: Restore node_modules
        id: modules
        if: steps.files.outputs.any == 'true'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        if: steps.files.outputs.any == 'true'

      - name: Locate the pnpm caches
        id: pnpmdirs
        if: steps.files.outputs.any == 'true' && steps.modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "cache=$(pnpm cache path)" >> "$GITHUB_OUTPUT"

      # The store holds the packages; the cache holds registry metadata and the
      # lockfile verification log, which is what the supply-chain policies look
      # at. Only needed when something has to be installed.
      - name: Restore the pnpm store and metadata cache
        if: steps.files.outputs.any == 'true' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpmdirs.outputs.store }}
            ${{ steps.pnpmdirs.outputs.cache }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # Every step below runs through pnpm, which reads `devEngines.runtime` and
      # downloads the pinned Node itself, so the job ships no Node of its own.
      - name: Install
        if: steps.files.outputs.any == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # A restored tree carries the client that was generated when it was
      # cached, which may be older than the schema in this checkout. Cheap, so
      # it runs either way rather than relying on `prepare` having fired.
      - name: Generate the Prisma client
        if: steps.files.outputs.any == 'true'
        run: pnpm exec prisma generate

      # A dev dependency imported from src/ compiles and then dies in the image,
      # so the imports are checked against a tree linked the way production links it.
      - name: Check the production dependency tree
        if: steps.files.outputs.deps == 'true' || steps.files.outputs.code == 'true'
        run: pnpm run check:prod-deps

      - name: Lint the touched files
        if: steps.files.outputs.lint == 'true'
        run: xargs -0 -a "$RUNNER_TEMP/lint.txt" pnpm exec eslint --max-warnings=0

      - name: Check formatting of the touched files
        if: steps.files.outputs.format == 'true'
        run: xargs -0 -a "$RUNNER_TEMP/format.txt" pnpm exec prettier --check

      # Whole-project by necessity. The cache key changes with every push, so
      # the restore-keys prefix always hands over the previous run's build info
      # and tsc only re-checks what the diff can affect.
      - name: Restore the typecheck cache
        if: steps.files.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: "**/*.tsbuildinfo"
          key: tsc-${{ runner.os }}-${{ github.base_ref || 'main' }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ github.base_ref || 'main' }}-
            tsc-${{ runner.os }}-

      - name: Typecheck
        if: steps.files.outputs.code == 'true'
        run: pnpm run typecheck

      - name: Test the touched suites
        if: steps.files.outputs.tests == 'true'
        run: xargs -0 -a "$RUNNER_TEMP/tests.txt" pnpm exec vitest run --reporter=dot

      # A "use client" module that reaches `@/lib/db` or a node builtin fails
      # the image build, and only the whole import graph shows it, so this runs
      # on every code diff rather than only when its own file is touched.
      - name: Check the client boundary
        if: steps.files.outputs.code == 'true'
        run: pnpm exec vitest run __tests__/client-boundary.test.ts --reporter=dot

      - name: Nothing to check
        if: steps.files.outputs.any == 'false'
        run: echo "No code, markdown or test files in this diff."
