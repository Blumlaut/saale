services:
  web:
    build:
      context: .
      target: ${BUILD_TARGET:-production}
    container_name: saale-web
    ports:
      - "3630:3000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://saale:saale@postgres:5432/saale
      - REDIS_URL=redis://redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3630}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (64-char hex)}
      - UPLOADS_DIR=/app/uploads
      - SEARXNG_URL=http://searxng:8080
      - OPEN_TERMINAL_URL=http://open-terminal:8000
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - WORKER_API_KEY=${WORKER_API_KEY:?Set WORKER_API_KEY}
      - APP_URL=${APP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      open-terminal:
        condition: service_healthy
    command: ${WEB_COMMAND:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - dist/
            - .git/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: prisma/schema.prisma

  worker:
    build:
      context: .
      target: production-worker
    container_name: saale-worker
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://saale:saale@postgres:5432/saale
      - REDIS_URL=redis://redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3630}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (64-char hex)}
      - UPLOADS_DIR=/app/uploads
      - SEARXNG_URL=http://searxng:8080
      - OPEN_TERMINAL_URL=http://open-terminal:8000
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - WORKER_API_KEY=${WORKER_API_KEY:?Set WORKER_API_KEY}
      - WORKER_APP_URL=http://web:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      web:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: saale-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=saale
      - POSTGRES_USER=saale
      - POSTGRES_PASSWORD=saale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: saale-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: saale-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_HOST=http://0.0.0.0:8080
      - SEARXNG_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: saale-open-terminal
    restart: unless-stopped
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?Set OPEN_TERMINAL_API_KEY}
      - OPEN_TERMINAL_MULTI_USER=true
      - OPEN_TERMINAL_PIP_PACKAGES=yt-dlp
    volumes:
      - open-terminal-data:/home
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  open-terminal-data:
