services:
  app:
    build:
      context: .
      target: ${BUILD_TARGET:-development}
    container_name: saale-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - saale_node_modules:/app/node_modules
      - saale_next:/app/.next
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://saale:saale@postgres:5432/saale}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (64-char hex)}
      - UPLOADS_DIR=/app/uploads
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - OPEN_TERMINAL_URL=${OPEN_TERMINAL_URL:-http://open-terminal:8000}
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      open-terminal:
        condition: service_healthy
    command: ${APP_COMMAND:-sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run worker & npm run dev"}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - dist/
            - .git/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: prisma/schema.prisma

  postgres:
    image: postgres:17-alpine
    container_name: saale-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=saale
      - POSTGRES_USER=saale
      - POSTGRES_PASSWORD=saale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: saale-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: saale-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_HOST=http://0.0.0.0:8080
      - SEARXNG_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: saale-open-terminal
    restart: unless-stopped
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?Set OPEN_TERMINAL_API_KEY}
      - OPEN_TERMINAL_MULTI_USER=true
      - OPEN_TERMINAL_PIP_PACKAGES=yt-dlp
    volumes:
      - open-terminal-data:/home
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  saale_node_modules:
  saale_next:
  open-terminal-data:
