allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
# The pi packages, jiti and defuddle declare only an `import` export condition,
# which tsx's CJS loader cannot require. Each patch adds a `default` condition.
patchedDependencies:
  '@earendil-works/pi-agent-core@1.5.0': patches/@earendil-works__pi-agent-core@1.5.0.patch
  '@earendil-works/pi-ai@1.5.0': patches/@earendil-works__pi-ai@1.5.0.patch
  '@earendil-works/pi-codemode@1.5.0': patches/@earendil-works__pi-codemode@1.5.0.patch
  '@earendil-works/pi-coding-agent@1.5.0': patches/@earendil-works__pi-coding-agent@1.5.0.patch
  '@earendil-works/pi-mcp@1.5.0': patches/@earendil-works__pi-mcp@1.5.0.patch
  '@earendil-works/pi-schema@1.5.0': patches/@earendil-works__pi-schema@1.5.0.patch
  '@earendil-works/pi-telemetry@1.5.0': patches/@earendil-works__pi-telemetry@1.5.0.patch
  'defuddle@0.19.6': patches/defuddle@0.19.6.patch
  jiti@2.7.0: patches/jiti@2.7.0.patch
