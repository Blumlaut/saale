# pnpm reads settings from this file, not from package.json. An `overrides` block
# next to the dependencies is npm's shape and pnpm ignores it without a word.
overrides:
  'monaco-editor>dompurify': ^3.4.17
  # Prisma pins 3.20.0, which a ReDoS in Schema.TemplateLiteral affects.
  '@prisma/config>effect': ^3.22.5
  '@earendil-works/pi-ai>undici': ^8.12.4
  '@earendil-works/pi-coding-agent>undici': ^8.12.4
  # ts-morph 26 pins minimatch 10, which globparts amplification affects.
  '@ts-morph/common>minimatch': ^11.0.1
allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
# The pi packages, jiti and defuddle declare only an `import` export condition,
# which tsx's CJS loader cannot require. Each patch adds a `default` condition.
patchedDependencies:
  '@earendil-works/pi-agent-core@1.6.0': patches/@earendil-works__pi-agent-core@1.6.0.patch
  '@earendil-works/pi-ai@1.6.0': patches/@earendil-works__pi-ai@1.6.0.patch
  '@earendil-works/pi-codemode@1.6.0': patches/@earendil-works__pi-codemode@1.6.0.patch
  '@earendil-works/pi-coding-agent@1.6.0': patches/@earendil-works__pi-coding-agent@1.6.0.patch
  '@earendil-works/pi-mcp@1.6.0': patches/@earendil-works__pi-mcp@1.6.0.patch
  '@earendil-works/pi-schema@1.6.0': patches/@earendil-works__pi-schema@1.6.0.patch
  '@earendil-works/pi-telemetry@1.6.0': patches/@earendil-works__pi-telemetry@1.6.0.patch
  defuddle@0.19.7: patches/defuddle@0.19.7.patch
  jiti@2.7.0: patches/jiti@2.7.0.patch
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.6.0'
  - '@earendil-works/pi-ai@1.6.0'
  - '@earendil-works/pi-codemode@1.6.0'
  - '@earendil-works/pi-coding-agent@1.6.0'
  - '@earendil-works/pi-mcp@1.6.0'
  - '@earendil-works/pi-schema@1.6.0'
  - '@earendil-works/pi-telemetry@1.6.0'
  - '@earendil-works/pi-tui@1.6.0'
  - effect@3.22.5
permissions:
  compromise:
    skills: false
