services:
  # Production-only step — in dev the schema is pushed by the web/worker commands.
  migrate:
    build:
      target: development
    entrypoint: ["sh", "-c"]
    command: ["echo 'dev: schema handled by prisma db push'"]

  # Not built in dev: sandbox-exec creates containers on demand from the image
  # CI builds, and a 2 GB toolchain image per `up` is not worth the wait.
  sandbox-image:
    profiles: ["image"]

  web:
    build:
      target: development
    volumes:
      - .:/app
      - saale_node_modules:/app/node_modules
      - saale_next:/app/.next
      - uploads_data:/app/uploads
      - saale_workspaces:/w
    environment:
      - NODE_ENV=development
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npx next dev --turbopack --port 3000"

  worker:
    build:
      target: development
    volumes:
      - .:/app
      - saale_node_modules:/app/node_modules
      - uploads_data:/app/uploads
      - saale_workspaces:/w
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://saale:saale@postgres:5432/saale
      - REDIS_URL=redis://redis:6379
      - WORKER_APP_URL=http://web:3000
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && ./node_modules/.bin/tsx --watch src/lib/queue/worker.ts"

  sandbox-exec:
    build:
      target: development
    volumes:
      - .:/app
      - saale_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - saale_workspaces:/w
    command: sh -c "./node_modules/.bin/tsx --watch src/sandbox/server.ts"

volumes:
  saale_node_modules:
  saale_next:
  uploads_data:
