[package]
name = "saale-agent"
version = "0.0.0"
edition = "2021"
description = "Saale desktop agent: lets a chat use this computer"
license = "AGPL-3.0-only"

[[bin]]
name = "saale-agent"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
# x11rb only: the libei backend unwraps its portal connection, so a machine
# without xdg-desktop-portal panics instead of falling back. Wayland input comes
# back through a guarded path, not this feature.
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
  "io-util",
  "time",
  "sync",
] }
xcap = { version = "0.9.8", default-features = false }

[profile.release]
lto = true
strip = true
