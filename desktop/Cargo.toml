[package]
name = "saale-agent"
version = "0.0.0"
edition = "2021"
description = "Saale desktop agent: lets a chat use this computer"
license = "AGPL-3.0-only"

[[bin]]
name = "saale-agent"
path = "src/main.rs"

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "screenshot"] }
base64 = "0.22"
# x11rb only: the libei backend unwraps its portal connection, so a machine
# without xdg-desktop-portal panics instead of falling back. Wayland input comes
# back through a guarded path, not this feature.
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
futures-util = "0.3"
# tao draws the window with GTK 3, and Wayland takes the app id from its program
# class, which is the name a taskbar looks the icon up by.
gtk = "0.18"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = { version = "0.3.7", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "image-png"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
  "io-util",
  "time",
  "sync",
] }
xcap = { version = "0.9.8", default-features = false }
x11rb = "0.13"

[profile.release]
lto = true
strip = true

[build-dependencies]
tauri-build = "2.7.4"
